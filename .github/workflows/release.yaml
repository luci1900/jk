name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REPO: ghcr.io/luci1900
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Operator image
        run: |
          KO_DOCKER_REPO=$REPO VERSION=${{ github.ref_name }} \
            go tool ko build --base-import-paths --tags ${{ github.ref_name }} --platform $PLATFORMS ./cmd/jk-operator

      - name: Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/agent.Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ghcr.io/luci1900/jk-agent:${{ github.ref_name }}
          build-args: LDFLAGS=-X github.com/luci1900/jk/internal/version.Version=${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: CLI binaries
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            for cmd in kubectl-jk kubectl_complete-jk; do
              GOOS=$os GOARCH=$arch go build -ldflags '-X github.com/luci1900/jk/internal/version.Version=${{ github.ref_name }}' \
                -o dist/$cmd-$os-$arch ./cmd/$cmd
            done
          done
      - run: gh release create ${{ github.ref_name }} dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
