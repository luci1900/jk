---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: appdata.jk.luci1900.github.io
spec:
  group: jk.luci1900.github.io
  names:
    kind: AppData
    listKind: AppDataList
    plural: appdata
    singular: appdata
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AppData is an application's leader-written state, named after
          the application.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AppDataSpec is written only by the leader.
            properties:
              ownedSecrets:
                additionalProperties:
                  description: |-
                    OwnedSecret is the index entry of a secret that the unit or the application owns. The metadata Secret is the source
                    of truth; the index lets the agents find owned secrets by label, and see new revisions, without listing Secrets.
                  properties:
                    expireTime:
                      description: ExpireTime is when the latest revision expires.
                      format: date-time
                      type: string
                    grants:
                      description: |-
                        Grants mirrors the grants on the metadata Secret, so that consumers can tell from informer data whether they
                        may read the secret (and a Forbidden from the API server is a Role that has not caught up yet).
                      items:
                        description: |-
                          SecretGrant is one entry of the SecretGrantsAnnotation: access for an application (and optionally one of its
                          units or a relation, which the agents enforce, as RBAC works per ServiceAccount).
                        properties:
                          application:
                            type: string
                          relation:
                            type: string
                          unit:
                            type: string
                        required:
                        - application
                        type: object
                      type: array
                    label:
                      type: string
                    revision:
                      description: Revision is the latest revision.
                      type: integer
                    revisions:
                      description: Revisions are the revisions that still exist.
                      items:
                        type: integer
                      type: array
                  required:
                  - revision
                  type: object
                description: OwnedSecrets indexes the application-owned secrets by
                  secret id (the xid).
                type: object
              relations:
                additionalProperties:
                  additionalProperties:
                    type: string
                  description: RelationData is a flat string map, as relation data
                    is in juju.
                  type: object
                description: Relations maps relation id to the application's relation
                  settings.
                type: object
              status:
                description: 'WorkloadStatus is a juju status: a state name, a message
                  and a timestamp.'
                properties:
                  message:
                    type: string
                  since:
                    format: date-time
                    type: string
                  state:
                    description: State is one of juju's workload states (active, blocked,
                      maintenance, waiting, unknown, error, ...).
                    type: string
                required:
                - state
                type: object
            type: object
        type: object
    served: true
    storage: true
