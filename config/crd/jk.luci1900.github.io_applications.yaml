---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: applications.jk.luci1900.github.io
spec:
  group: jk.luci1900.github.io
  names:
    kind: Application
    listKind: ApplicationList
    plural: applications
    shortNames:
    - app
    singular: application
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.charm.name
      name: Charm
      type: string
    - jsonPath: .status.charm.revision
      name: Rev
      type: integer
    - jsonPath: .spec.scale
      name: Scale
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Application is a deployed charm.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ApplicationSpec is the desired state of a charmed application.
            properties:
              charm:
                description: |-
                  CharmSpec identifies a charm. Only Name is required; everything else is an optional pin
                  that the operator resolves through Charmhub when unset (the result lands in status).
                properties:
                  base:
                    type: string
                  channel:
                    type: string
                  name:
                    type: string
                  revision:
                    minimum: 0
                    type: integer
                  sha256:
                    type: string
                  source:
                    default: charmhub
                    enum:
                    - charmhub
                    - local
                    type: string
                  url:
                    type: string
                required:
                - name
                type: object
              config:
                additionalProperties:
                  type: string
                type: object
              constraints:
                description: Constraints are the subset of juju constraints supported
                  on k8s.
                properties:
                  arch:
                    type: string
                  cpu-power:
                    type: integer
                  mem:
                    type: string
                type: object
              resources:
                additionalProperties:
                  type: string
                type: object
              scale:
                default: 1
                format: int32
                minimum: 0
                type: integer
              storage:
                additionalProperties:
                  description: StorageSpec configures one charm storage.
                  properties:
                    size:
                      type: string
                    storageClass:
                      type: string
                  type: object
                type: object
              trust:
                default: none
                description: Trust is the level of k8s access granted to a charm.
                enum:
                - none
                - namespace
                - cluster
                type: string
            required:
            - charm
            type: object
          status:
            description: ApplicationStatus is the observed state of an application.
            properties:
              charm:
                description: ResolvedCharm is what the operator learned about the
                  charm, recorded once.
                properties:
                  actions:
                    x-kubernetes-preserve-unknown-fields: true
                  architecture:
                    description: Architecture is the architecture the charm and its
                      pods run on (Charmhub charms).
                    type: string
                  base:
                    type: string
                  channel:
                    description: Channel is the channel the revision was resolved
                      from (Charmhub charms resolved by channel).
                    type: string
                  configSchema:
                    x-kubernetes-preserve-unknown-fields: true
                  image:
                    description: Image is the digest-pinned reference of the charm
                      in jk-registry.
                    type: string
                  metadata:
                    description: Metadata, Config and Actions are the charm's metadata.yaml,
                      config.yaml and actions.yaml as JSON.
                    x-kubernetes-preserve-unknown-fields: true
                  pin:
                    description: |-
                      Pin identifies the spec pins (source, channel, revision, base, url, sha256, arch) this status was resolved from.
                      The operator resolves again only when the pins no longer match: changing them is a refresh.
                    type: string
                  resourceImages:
                    additionalProperties:
                      type: string
                    description: ResourceImages maps resource name to the image reference
                      the pods use.
                    type: object
                  revision:
                    type: integer
                  sha256:
                    description: |-
                      Sha256 is the hex sha256 of the downloaded .charm file for Charmhub charms, and the digest of the
                      charm image in jk-registry ("sha256:<hex>") for local charms.
                    type: string
                  url:
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              leader:
                description: Leader is the unit holding leadership, e.g. "postgresql-k8s/0".
                type: string
              observedGeneration:
                format: int64
                type: integer
              status:
                description: Status is the application status as set by the leader.
                properties:
                  message:
                    type: string
                  since:
                    format: date-time
                    type: string
                  state:
                    description: State is one of juju's workload states (active, blocked,
                      maintenance, waiting, unknown, error, ...).
                    type: string
                required:
                - state
                type: object
              units:
                description: Units reports, for each existing pod, the charm it was
                  started with.
                items:
                  description: UnitCharmStatus is the charm a unit's pod runs; during
                    a refresh units differ until each pod has rolled.
                  properties:
                    image:
                      description: Image is the charm image the pod was started with.
                      type: string
                    name:
                      description: Name is the unit name, e.g. "postgresql-k8s/0".
                      type: string
                    revision:
                      description: Revision is the Charmhub revision of the charm
                        the pod was started with (0 for local charms).
                      type: integer
                    upToDate:
                      description: UpToDate is true when Image is status.charm.image
                        and the unit has run it (its upgrade-charm hook, if any, is
                        done).
                      type: boolean
                  required:
                  - name
                  - upToDate
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
