---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: offers.jk.luci1900.github.io
spec:
  group: jk.luci1900.github.io
  names:
    kind: Offer
    listKind: OfferList
    plural: offers
    singular: offer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.application
      name: Application
      type: string
    - jsonPath: .spec.endpoints
      name: Endpoints
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Offer exposes endpoints of an application to other models (namespaces).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OfferSpec says which endpoints of an application other models
              may relate to.
            properties:
              allowedModels:
                description: |-
                  AllowedModels are the namespaces whose applications may relate to the offer ("*": all). A user who may create
                  relations in the Offer's namespace needs no entry.
                items:
                  type: string
                type: array
              application:
                description: Application is the offered application, in the Offer's
                  namespace.
                type: string
              endpoints:
                description: Endpoints are the offered endpoint names of the application.
                items:
                  type: string
                minItems: 1
                type: array
            required:
            - application
            - endpoints
            type: object
          status:
            description: OfferStatus is what the operator knows about the offer.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connections:
                items:
                  description: OfferConnection is a relation from another model to
                    the offer.
                  properties:
                    application:
                      type: string
                    endpoint:
                      type: string
                    namespace:
                      description: Namespace and Relation name the consumer's Relation;
                        Application and Endpoint the consuming side.
                      type: string
                    relation:
                      type: string
                    status:
                      description: Status is "joining" until the relation is established,
                        then "joined"; "removing" while it is being removed.
                      type: string
                  required:
                  - application
                  - endpoint
                  - namespace
                  - relation
                  - status
                  type: object
                type: array
              endpoints:
                description: Endpoints are the offered endpoints with their interfaces
                  (set once the charm is resolved).
                items:
                  description: |-
                    OfferEndpoint describes an offered endpoint, so that consumers can pick the endpoints to relate without reading the
                    offered application.
                  properties:
                    interface:
                      type: string
                    name:
                      type: string
                    role:
                      description: Role is "provider" or "requirer".
                      type: string
                  required:
                  - interface
                  - name
                  - role
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
