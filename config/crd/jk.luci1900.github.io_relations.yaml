---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: relations.jk.luci1900.github.io
spec:
  group: jk.luci1900.github.io
  names:
    kind: Relation
    listKind: RelationList
    plural: relations
    singular: relation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.id
      name: ID
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Valid")].status
      name: Valid
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Relation connects two application endpoints (or one, for a peer
          relation).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              alias:
                description: |-
                  Alias is the name the application on the other side has for the charms of this namespace (default: the
                  offer's name). It must not clash with an application of the namespace.
                type: string
              endpoints:
                items:
                  description: |-
                    EndpointRef names one side of a relation. The namespace is part of the reference so
                    offers can be added later; until then the operator rejects other namespaces.
                  properties:
                    application:
                      type: string
                    endpoint:
                      type: string
                    namespace:
                      type: string
                  required:
                  - application
                  - endpoint
                  - namespace
                  type: object
                maxItems: 2
                minItems: 1
                type: array
              offer:
                description: |-
                  Offer names the Offer (in the other endpoint's namespace) a relation across namespaces consumes. A Relation
                  is in the consumer's namespace; its endpoints name the consuming application and the offered one.
                type: string
            required:
            - endpoints
            type: object
          status:
            properties:
              conditions:
                description: |-
                  Conditions: Ready summarises the others; Valid says whether the endpoints can be related (no id is assigned, so no hook runs, until it
                  is true); Removing is true while a deleted Relation waits for its units' relation-departed and
                  relation-broken hooks.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              id:
                description: ID is the integer relation id charms see; assigned by
                  the operator, never reused.
                format: int64
                type: integer
              observedGeneration:
                description: ObservedGeneration is the spec generation the conditions
                  describe.
                format: int64
                type: integer
              remoteID:
                description: |-
                  RemoteID is, for a relation across namespaces, the id the other namespace gave it (each model numbers its own
                  relations, as in juju). The operator's mirror Relation in the offering namespace has it as its ID.
                format: int64
                type: integer
              suspended:
                description: Suspended mirrors juju's relation suspension.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
