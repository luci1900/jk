kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: remotedata.jk.luci1900.github.io
spec:
  group: jk.luci1900.github.io
  names:
    kind: RemoteData
    listKind: RemoteDataList
    plural: remotedata
    singular: remotedata
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.application
      name: Remote
      type: string
    - jsonPath: .spec.relationID
      name: Relation
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RemoteData is named after the Relation of its namespace it belongs
          to.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RemoteDataSpec is the other side's data of a relation to another namespace, copied in by the operator (and only by
              it): what the application and its units on the other side have set in this one relation.
            properties:
              appData:
                additionalProperties:
                  type: string
                description: AppData are the remote application's settings.
